name: production deployment

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testmaker-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master' && (vars.PRODUCTION_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: dom, fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, sqlite3, simplexml, xmlreader, xmlwriter, zip

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Check cPanel HTTPS reachability
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          if [ -z "$CPANEL_API_TOKEN" ]; then
            echo 'Add CPANEL_API_TOKEN to the production environment before deploying.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 --output /dev/null https://testmaker.pk:2083/

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          cp .env.example .env
          php artisan key:generate --force

      - name: Build frontend
        run: npm run build

      - name: Test application and deployment runner
        run: |
          ./vendor/bin/pest
          python3 deploy/cpanel/smoke_test.py

      - name: Prepare production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Package immutable release
        run: |
          mkdir -p dist/stage
          git archive "$GITHUB_SHA" | tar -xf - -C dist/stage
          cp -a vendor dist/stage/vendor
          cp -a public/build dist/stage/public/build
          python3 deploy/cpanel/package.py dist/stage "dist/release-$GITHUB_SHA.zip"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          commit = os.environ['GITHUB_SHA']
          archive = Path('dist') / f'release-{commit}.zip'
          with archive.open('rb') as handle:
              checksum = hashlib.file_digest(handle, 'sha256').hexdigest()
          parts_dir = Path('dist/parts')
          parts_dir.mkdir()
          parts = []
          with archive.open('rb') as handle:
              for index, chunk in enumerate(iter(lambda: handle.read(8 * 1024 * 1024), b''), start=1):
                  name = f'release-{commit}.part{index:03d}'
                  (parts_dir / name).write_bytes(chunk)
                  parts.append({'name': name, 'size': len(chunk), 'sha256': hashlib.sha256(chunk).hexdigest()})
          if not parts or len(parts) > 256:
              raise SystemExit('Release must contain between 1 and 256 upload parts')
          Path('dist/release.json').write_text(json.dumps({
              'commit': commit,
              'sha256': checksum,
              'parts': parts,
          }) + '\n')
          PY

      - name: Upload deployment files through cPanel HTTPS API
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_USER: tmpk
        run: |
          if [ -z "$CPANEL_API_TOKEN" ]; then
            echo 'The production cPanel API token is not configured.' >&2
            exit 1
          fi

          upload() {
            local source="$1" directory="$2" name="$3"
            echo "Uploading $name..."
            curl --fail --silent --show-error --retry 2 --retry-delay 3 \
              --connect-timeout 10 --max-time 120 \
              --header "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
              --form "dir=$directory" --form 'overwrite=1' \
              --form "file-1=@$source;filename=$name" \
              --output dist/upload-response.json \
              https://testmaker.pk:2083/execute/Fileman/upload_files
            python3 - <<'PY'
          import json
          from pathlib import Path

          try:
              response = json.loads(Path('dist/upload-response.json').read_text())
          except (ValueError, OSError) as error:
              raise SystemExit(f'cPanel upload did not return valid JSON: {error}') from error
          result = response.get('result') if isinstance(response, dict) else None
          payload = result if isinstance(result, dict) and 'status' in result else response
          if not isinstance(payload, dict) or str(payload.get('status')) != '1':
              raise SystemExit(f"cPanel upload failed: {payload.get('errors') if isinstance(payload, dict) else 'unknown response'}")
          data = payload.get('data')
          if isinstance(data, dict) and int(data.get('failed') or 0) != 0:
              raise SystemExit(f"cPanel reported failed uploads: {data.get('failed')}")
          PY
            echo "Uploaded $name"
          }

          upload deploy/cpanel/deny.htaccess public_html/_deploy .htaccess
          upload deploy/cpanel/deny.htaccess public_html/_app .htaccess
          upload deploy/cpanel/runner.php public_html/_deploy runner.php
          upload deploy/cpanel/front-controller.php public_html/_deploy front-controller.php
          upload deploy/cpanel/public.htaccess public_html/_deploy public.htaccess
          for part in dist/parts/*; do
            upload "$part" public_html/_deploy/incoming "$(basename "$part")"
          done
          upload dist/release.json public_html/_deploy/incoming release.json

      - name: Wait for activation and check protected files
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        run: |
          activated=false
          for attempt in $(seq 1 120); do
            if curl --fail --silent \
              --dump-header dist/health-headers.txt \
              --output /dev/null https://testmaker.pk/up \
              && grep -iq "^x-testmaker-release: $GITHUB_SHA" dist/health-headers.txt; then
              activated=true
              break
            fi
            sleep 5
          done

          if [ "$activated" != true ]; then
            echo 'Release did not become healthy within ten minutes. Check public_html/_deploy/deploy.log in cPanel File Manager.' >&2
            exit 1
          fi

          private_status=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' https://testmaker.pk/_app/shared/.env)
          if [ "$private_status" != 403 ] && [ "$private_status" != 404 ]; then
            echo "Private app files are accessible over HTTP (status $private_status)." >&2
            exit 1
          fi
