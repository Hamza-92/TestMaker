name: production deployment

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testmaker-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master' && (vars.PRODUCTION_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: dom, fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, sqlite3, simplexml, xmlreader, xmlwriter, zip

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          cp .env.example .env
          php artisan key:generate --force

      - name: Build frontend
        run: npm run build

      - name: Test application and deployment runner
        run: |
          ./vendor/bin/pest
          python3 deploy/cpanel/smoke_test.py

      - name: Prepare production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Package immutable release
        run: |
          mkdir -p dist/stage
          git archive "$GITHUB_SHA" | tar -xf - -C dist/stage
          cp -a vendor dist/stage/vendor
          cp -a public/build dist/stage/public/build
          python3 deploy/cpanel/package.py dist/stage "dist/release-$GITHUB_SHA.zip"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          commit = os.environ['GITHUB_SHA']
          archive = Path('dist') / f'release-{commit}.zip'
          with archive.open('rb') as handle:
              checksum = hashlib.file_digest(handle, 'sha256').hexdigest()
          Path('dist/release.json').write_text(json.dumps({
              'commit': commit,
              'sha256': checksum,
          }) + '\n')
          PY

      - name: Upload deployment files by explicit FTPS
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_HOST: ftp.testmaker.pk
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo 'The production FTPS credentials are not configured.' >&2
            exit 1
          fi

          upload() {
            curl --fail --silent --show-error --retry 3 \
              --ssl-reqd --ftp-create-dirs \
              --user "$FTP_USER:$FTP_PASSWORD" \
              --upload-file "$1" "ftp://$FTP_HOST/$2"
          }

          upload deploy/cpanel/deny.htaccess _deploy/.htaccess
          upload deploy/cpanel/deny.htaccess _app/.htaccess
          upload deploy/cpanel/runner.php _deploy/runner.php
          upload deploy/cpanel/front-controller.php _deploy/front-controller.php
          upload deploy/cpanel/public.htaccess _deploy/public.htaccess
          upload "dist/release-$GITHUB_SHA.zip" "_deploy/incoming/release-$GITHUB_SHA.zip"
          upload dist/release.json _deploy/incoming/release.json

      - name: Wait for activation and check protected files
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        run: |
          activated=false
          for attempt in $(seq 1 120); do
            if curl --fail --silent \
              --dump-header dist/health-headers.txt \
              --output /dev/null https://testmaker.pk/up \
              && grep -iq "^x-testmaker-release: $GITHUB_SHA" dist/health-headers.txt; then
              activated=true
              break
            fi
            sleep 5
          done

          if [ "$activated" != true ]; then
            echo 'Release did not become healthy within ten minutes. Check public_html/_deploy/deploy.log in cPanel File Manager.' >&2
            exit 1
          fi

          private_status=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' https://testmaker.pk/_app/shared/.env)
          if [ "$private_status" != 403 ] && [ "$private_status" != 404 ]; then
            echo "Private app files are accessible over HTTP (status $private_status)." >&2
            exit 1
          fi
