<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; background: white; }
#paper { width: 190mm; font-family: "Times New Roman", serif; --paper-heading-size: 13px; --paper-heading-line-height: 1; --paper-question-size: 13px; --paper-question-line-height: 1; --paper-heading-border-width: 1px; --paper-heading-border-style: solid; --paper-question-border-width: 1px; --paper-question-border-style: solid; }
[data-paper-heading] { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:4px 8px; font-size:13px; line-height:1; font-weight:bold; border:1px solid black; }
[data-paper-heading] > div { min-width:0; text-align:left; }
[data-paper-objective-table] { width:100%; table-layout:fixed; border-collapse:collapse; border-spacing:0; font-size:13px; line-height:1; }
[data-paper-objective-table] th, [data-paper-objective-table] td { border:1px solid black; box-sizing:border-box; padding:4px 8px; }
[data-paper-objective-table] th { font-weight:bold; }
</style></head><body>
<div id="paper" data-print-paper>
<section class="paper-section">
<div data-paper-heading class="flex items-start justify-between gap-3 px-2 py-1 font-bold"><div class="min-w-0 text-left">Q.1:- Fill the relevant bubble against each question according to curriculum.</div></div>
<table data-paper-objective-table><colgroup><col style="width:6%"><col style="width:30%"><col style="width:16%"><col style="width:16%"><col style="width:16%"><col style="width:16%"></colgroup><thead><tr><th>Sr</th><th>Questions</th><th>A</th><th>B</th><th>C</th><th>D</th></tr></thead><tbody id="rows"></tbody></table>
</section>
<section class="paper-section"><div data-paper-heading class="flex items-start justify-between gap-3 px-2 py-1 font-bold"><div class="min-w-0 text-left">STIMULUS/SITUATION/SCENARIO BASED MCQs</div></div><table data-paper-objective-table><tbody><tr data-paper-question><td>Biology has three main divisions: Botany, Zoology, and Microbiology. To make it study convenient, it is divided into a number of sub-fields.</td></tr></tbody></table></section>
</div><pre id="status">loading</pre><textarea id="result"></textarea>
<script type="module">
import { downloadPaperPdf } from '/resources/js/pages/customer/papers/paper-layouts/download-paper-pdf.ts';
import { DEFAULT_PAPER_SETTINGS } from '/resources/js/pages/customer/papers/paper-layouts/types.ts';
const rows = document.getElementById('rows');
rows.innerHTML = Array.from({ length: 26 }, (_, i) => `<tr data-paper-question><td style="height:42px">${i + 1}</td><td>${i % 3 === 0 ? 'The cell wall of prokaryotes is made up of:' : 'What is a key role of leaves in supporting plants?'}</td><td>Cellulose</td><td>Lignin</td><td>Peptidoglycan</td><td>Chitin</td></tr>`).join('');
try {
 const pdf = await downloadPaperPdf({ papers: [document.getElementById('paper')], settings: { ...DEFAULT_PAPER_SETTINGS, marginTop: 10, marginBottom: 10, marginLeft: 10, marginRight: 10 }, name: 'PDF Regression', save: false });
 document.getElementById('result').textContent = pdf.output('datauristring').split(',')[1];
 document.getElementById('status').textContent = `done ${pdf.getNumberOfPages()} pages`;
} catch (error) { document.getElementById('status').textContent = `error ${error?.message || error}`; }
</script></body></html>
